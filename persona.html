<title>Persona do Cliente Ideal — Tomorrow Marketing</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fff;--bg2:#f7f6f4;--text:#1a1a1a;--text2:#555;--text3:#999;--border:rgba(0,0,0,.1);--border2:rgba(0,0,0,.18);--O:#E8761E;--r:12px;--rs:8px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
#app{max-width:660px;margin:0 auto;padding:2rem 1.25rem}
.card{background:var(--bg);border:.5px solid var(--border);border-radius:var(--r);padding:1.5rem}
.btn{display:block;width:100%;padding:.875rem 1.25rem;border-radius:var(--rs);font-size:15px;font-weight:500;cursor:pointer;border:none;font-family:inherit;transition:opacity .15s}
.bp{background:var(--O);color:#fff}.bp:hover{opacity:.9}
.bg{background:transparent;color:var(--text2);border:.5px solid var(--border2)}.bg:hover{background:var(--bg2)}
input,textarea{width:100%;padding:.75rem 1rem;border-radius:var(--rs);border:.5px solid var(--border2);background:var(--bg);color:var(--text);font-size:15px;font-family:inherit;outline:none;display:block;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus{border-color:var(--O);box-shadow:0 0 0 3px rgba(232,118,30,.12)}
textarea{resize:none;font-size:14px;line-height:1.6}
.opt{width:100%;text-align:left;padding:.875rem 1rem;border:.5px solid var(--border);border-radius:var(--rs);background:var(--bg);color:var(--text);font-size:14px;cursor:pointer;display:block;font-family:inherit;margin-bottom:.5rem;transition:border-color .12s,background .12s,color .12s;line-height:1.45}
.opt:hover{border-color:var(--O);background:rgba(232,118,30,.04)}
.opt.sel{border-color:var(--O);background:rgba(232,118,30,.09);color:var(--O);font-weight:500}
.pt{height:3px;background:var(--border);border-radius:2px;margin-bottom:1.5rem}
.pf{height:100%;border-radius:2px;background:var(--O);transition:width .4s}
.dh{background:#0D1620;border-radius:var(--r);padding:2rem 1.5rem;text-align:center;margin-bottom:1.25rem}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:.625rem;margin-bottom:1.25rem}
.ci{padding:.875rem 1rem;border:.5px solid var(--border);border-radius:var(--rs);cursor:pointer;font-family:inherit;background:var(--bg);color:var(--text);font-size:13.5px;text-align:left;transition:border-color .12s,background .12s;font-weight:500;line-height:1.3}
.ci:hover{border-color:var(--O);background:rgba(232,118,30,.04)}
.ci.sel{border-color:var(--O);background:rgba(232,118,30,.09);color:var(--O)}
.ci small{display:block;font-size:11px;color:var(--text3);font-weight:400;margin-top:3px}
.ci.sel small{color:rgba(232,118,30,.65)}
.dim{display:flex;gap:.75rem;align-items:flex-start;margin-bottom:.875rem}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
@media(max-width:480px){#app{padding:1.25rem 1rem}.card{padding:1.25rem}.cg{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const O='#E8761E';
const CN=['Alimentação','Saúde & Estética','Serviços Profissionais','Varejo','Educação & Coaching','Construção & Imóveis','Moda & Lifestyle','Tecnologia & Digital'];
const CE=['Restaurante · Lanchonete · Confeitaria','Clínica · Dentista · Nutricionista · Salão','Advocacia · Contabilidade · Consultoria','Loja de roupa · Calçados · Pet shop','Escola · Curso · Mentor · Coach','Construtora · Imobiliária · Arquiteto','Moda · Acessórios · Decoração','Agência · Software · Freela · SaaS'];

// Per cluster: [nameA,tagA,discA,decA,blkA,convA, nameB,tagB,discB,decB,blkB,convB]
const P=[
  ['Isabela, 32','A Experienciadora','Redes sociais, Reels de bastidores e indicação de amigos próximos','O visual do prato, a atmosfera e a sensação de ocasião especial','Não encontrar avaliações recentes ou o visual da comunicação não convencer','Fotos de qualidade, depoimentos reais e a história por trás da casa',
   'Marcos, 38','O Habitual','Proximidade, Google Maps e indicação direta de quem já frequenta','Custo-benefício claro, cardápio objetivo e consistência no atendimento','Preço não visível, atendimento impessoal ou experiência abaixo do esperado','Promoções de rotina, combo do dia, avaliações positivas e facilidade de pedido'],
  ['Camila, 29','A Preventiva','Profissionais que segue nas redes, conteúdo educativo e indicação de amigas','Autoridade percebida, qualificação comprovada e resultado visual concreto','Não encontrar antes/depois reais ou profissional que parece distante','Conteúdo técnico acessível, transformações documentadas e presença de autoridade',
   'Roberto, 44','O Resolutivo','Indicação médica ou de amigos quando o problema já incomoda de verdade','Confiança na indicação recebida e clareza sobre o diagnóstico e o processo','Sentir-se julgado, não entender o procedimento ou preço não ser transparente','Acolhimento desde o primeiro contato, clareza total sobre o processo e o custo'],
  ['Pedro, 36','O Estrategista','LinkedIn, conteúdo de autoridade nas redes e networking profissional','Competência demonstrada, método claro e cases de resultado comprovado','Não entender o processo ou valor cobrado parecer alto sem justificativa','Linguagem direta, método explicado com clareza e resultados verificáveis',
   'Ana, 42','A Resolutora','Indicação direta de confiança quando já existe um problema urgente','A confiança na indicação recebida e a atenção personalizada que recebe','Sentir-se só mais um número ou o processo parecer burocrático demais','Atenção pessoal, prazo definido e explicação em linguagem simples e humana'],
  ['Juliana, 27','A Descobridora','Instagram, influenciadores e vitrines digitais de marcas que já acompanha','O desejo, o contexto de uso e a identidade que o produto representa','Visual que não convence, marca sem personalidade ou comunicação genérica','Conteúdo lifestyle de qualidade, identidade visual forte e prova social real',
   'Sandra, 39','A Pragmática','Necessidade específica, Google e indicação de quem já comprou','Custo-benefício claro, disponibilidade do produto e facilidade de compra','Preço não transparente, atendimento demorado ou dificuldade de troca','Clareza de preço, variedade, política de troca e agilidade no atendimento'],
  ['Lucas, 33','O Transformador','Conteúdo gratuito impactante nas redes, podcast e YouTube de referência','Resultado real de outros alunos e conexão genuína com o método','Não ver prova de resultado concreto ou sentir que é mais do mesmo','Depoimentos de transformação reais, amostra gratuita e método diferenciado',
   'Fernanda, 28','A Focada','Pesquisa ativa no Google quando quer aprender algo específico e prático','Grade curricular detalhada, duração, certificação e preço justo','Proposta vaga sobre o que será aprendido ou investimento desproporcional','Conteúdo do programa claro, certificado, preço justo e praticidade real'],
  ['Ricardo, 41','O Realizador','Instagram de projetos, revistas de decoração e indicação de amigos','Conexão estética com o portfólio e confiança construída com o profissional','Não ver projetos similares ao que imagina ou orçamento muito acima do esperado','Portfólio detalhado, processo explicado com clareza e histórias de clientes realizados',
   'Carlos, 47','O Calculista','Indicação direta e Google quando tem necessidade técnica ou financeira específica','Prazo, custo detalhado, garantias claras e reputação verificável','Orçamento sem detalhamento ou profissional que não passa segurança técnica','Proposta detalhada, contrato claro, referências verificáveis e histórico de prazo cumprido'],
  ['Beatriz, 25','A Expressiva','Instagram, influenciadores de estilo e lançamentos de novas coleções','A identidade que a peça transmite e o alinhamento com seu universo estético','Marca sem personalidade definida ou visual online que não desperta desejo','Editorial forte, lifestyle coerente com a marca e lançamentos frequentes',
   'Mariana, 35','A Seletiva','Indicação de amigas ou lojas que já conhece e em que confia há tempo','Qualidade do material, durabilidade percebida e custo por uso real','Preço alto sem justificativa clara ou ausência de política de troca transparente','Transparência sobre o produto, qualidade visível e atendimento personalizado'],
  ['Rafael, 34','O Vanguardista','LinkedIn, eventos de tecnologia e conteúdo especializado do setor','Capacidade técnica demonstrada e fit com a visão estratégica de longo prazo','Proposta genérica que não demonstra entendimento do problema específico','Cases relevantes, time qualificado com experiência demonstrada e capacidade de escala',
   'Thiago, 40','O Eficiente','Indicação direta quando tem problema concreto e urgente a resolver','Prazo definido, custo claro e clareza total sobre o que será entregue','Proposta técnica demais, processo complexo ou ROI não demonstrado com clareza','Proposta objetiva, prazo realista, suporte garantido e retorno sobre investimento claro']
];

// Ajustes de comunicação [tipo A (aspiracional), tipo B (prático)]
const ADJ=[
  ['Investir em conteúdo visual e editorial de qualidade — esse cliente decide pelo que vê e sente antes de ler qualquer texto',
   'Contar histórias e criar desejo antes de apresentar o produto ou serviço — a emoção vem antes da razão',
   'Mostrar identidade e posicionamento com clareza — esse perfil escolhe com quem se identifica, não apenas o que compra'],
  ['Tornar preço, processo e benefícios transparentes desde o primeiro contato — esse cliente descarta o que não é claro',
   'Investir em prova social verificável: avaliações reais, depoimentos e resultados mensuráveis',
   'Simplificar a mensagem — esse perfil não tem paciência para comunicação vaga ou promessas sem substância']
];

// Perguntas: [texto, [opções] ou null(aberta), [scores 0=A 1=B] ou null]
const qs=[
  ['Como esse cliente normalmente descobre o que você oferece?',
   ['Pelas redes sociais — feed, stories ou Reels','Por indicação de amigos ou conhecidos','Pesquisando ativamente no Google','Por acaso — passou na frente, viu placa ou anúncio'],
   [0,1,0,1]],
  ['O que melhor descreve o perfil do seu cliente ideal?',
   ['Está sempre atualizado, acompanha tendências e novidades','É prático e objetivo — compra quando precisa','Valoriza experiência e qualidade acima do preço','É cauteloso, pesquisa muito antes de qualquer decisão'],
   [0,1,0,1]],
  ['Qual é o principal motivador da compra?',
   ['Desejo, aspiração ou prazer','Necessidade ou problema concreto a resolver','Uma oportunidade, promoção ou facilidade','Aprovação social ou recomendação de alguém'],
   [0,1,1,0]],
  ['Como ele se comporta antes de comprar?',
   ['Age por impulso quando se identifica com algo','Compara opções, pesquisa preços e avalia bastante','Pede opinião de quem já comprou ou usou','Decide rápido se já confia na marca'],
   [0,1,1,0]],
  ['Qual é a relação dele com marcas que consome?',
   ['Muda com frequência, está sempre experimentando','É fiel a quem o atende bem e não muda fácil','Segue influenciadores e referências do setor','Não tem preferência de marca — foca no custo-benefício'],
   [0,1,0,1]],
  ['Descreva em 1 frase o problema que seu cliente chega querendo resolver:',null,null],
  ['O que mais pesa na decisão de compra?',
   ['Qualidade e reputação da marca','Preço e custo-benefício claro','Indicação de alguém de confiança','A experiência visual e emocional que a marca transmite'],
   [0,1,1,0]],
  ['O que normalmente trava ou atrasa a decisão?',
   ['Preço mais alto que o esperado','Falta de avaliações ou provas sociais','A comunicação não gerou identificação','Precisou consultar outra pessoa antes de decidir'],
   [1,1,0,1]],
  ['O que mais convence esse cliente a fechar?',
   ['Ver outras pessoas usando e aprovando','Entender claramente o processo e o que vai receber','Sentir conexão com a marca e sua história','Receber oferta, desconto ou facilidade de pagamento'],
   [1,0,0,1]],
  ['Como ele prefere ser abordado?',
   ['Conteúdo que entretém, inspira e desperta desejo','Informação clara, direta e sem rodeios','Depoimentos e casos reais de quem já comprou','Visual de qualidade que fala por si só'],
   [0,1,1,0]]
];

const S={screen:'landing',company:'',cluster:-1,qi:0,ans:new Array(10).fill(null),email:'',phone:''};

function calc(){
  let score=0;
  qs.forEach((q,i)=>{if(!q[2]||S.ans[i]===null)return;score+=q[2][S.ans[i]];});
  return{isB:score>=5,sec:score>=3&&score<=6};
}

function Landing(){return`<div style="text-align:center;padding:2rem 0 .5rem">
  <div style="font-size:32px;font-weight:800;color:${O};letter-spacing:-2px;margin-bottom:1.75rem">tmw</div>
  <h1 style="font-size:28px;font-weight:600;line-height:1.2;margin-bottom:.75rem">Persona do Cliente Ideal</h1>
  <p style="color:var(--text2);font-size:15px;margin-bottom:2rem;max-width:380px;margin-left:auto;margin-right:auto;line-height:1.7">Descubra como seu cliente ideal pensa, descobre e decide — e como sua comunicação deveria falar com ele.</p>
  <div class="card" style="max-width:520px;margin:0 auto;text-align:left">
    <label style="display:block;font-size:13.5px;color:var(--text2);margin-bottom:.5rem">Nome da empresa</label>
    <input id="ci" type="text" placeholder="Ex: ACME" value="${S.company}" style="margin-bottom:1.25rem">
    <label style="display:block;font-size:13.5px;color:var(--text2);margin-bottom:.625rem">Segmento do negócio</label>
    <div class="cg">
      ${CN.map((n,i)=>`<button class="ci${S.cluster===i?' sel':''}" onclick="pickC(${i})">${n}<small>${CE[i].split(' · ').slice(0,2).join(' · ')}</small></button>`).join('')}
    </div>
    <button class="btn bp" onclick="go()" style="${S.cluster<0?'opacity:.5':''}">Descobrir minha persona →</button>
  </div>
</div>`;}

function Question(){
  const q=qs[S.qi],n=S.qi+1,prog=n/10*100,open=!q[1];
  const blk=S.qi<5?'Perfil do Cliente':'Como Ele Decide';
  return`<div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.375rem">
      <span style="font-size:11.5px;font-weight:600;color:${O};text-transform:uppercase;letter-spacing:.08em">${blk}</span>
      <span style="font-size:13px;color:var(--text2)">${n} / 10</span>
    </div>
    <div class="pt"><div class="pf" style="width:${prog}%"></div></div>
    ${S.qi===6?`<div style="background:rgba(232,118,30,.07);border:.5px solid rgba(232,118,30,.2);border-radius:var(--rs);padding:.875rem 1rem;margin-bottom:1rem;font-size:14px;color:var(--text2);line-height:1.6"><strong style="color:${O}">Agora o processo de decisão.</strong> As próximas perguntas revelam como esse cliente decide comprar — e o que o faz não comprar.</div>`:''}
    <div class="card">
      <p style="font-size:17px;font-weight:500;margin-bottom:1.25rem;line-height:1.45">${n}. ${q[0]}</p>
      ${open?`<textarea id="oa" rows="3" placeholder="Ex: Quer emagrecer mas não consegue manter a rotina...">${S.ans[S.qi]||''}</textarea><button class="btn bp" onclick="nxt()" style="margin-top:.875rem">Continuar →</button>`:q[1].map((o,i)=>`<button class="opt${S.ans[S.qi]===i?' sel':''}" onclick="pick(${i})">${o}</button>`).join('')}
    </div>
    ${S.qi>0?`<button class="btn bg" onclick="bk()" style="margin-top:.625rem;width:auto;padding:.5rem 1rem;font-size:13px">← Voltar</button>`:''}
  </div>`;}

function Gate(){return`<div style="padding:1rem 0">
  <div class="card" style="max-width:440px;margin:0 auto;text-align:center">
    <div style="width:52px;height:52px;border-radius:50%;background:rgba(232,118,30,.1);display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="${O}" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h2 style="font-size:22px;font-weight:600;margin-bottom:.5rem">Persona mapeada!</h2>
    <p style="color:var(--text2);font-size:14px;margin-bottom:1.5rem;line-height:1.7">${S.company?`<strong>${S.company}</strong>, identificamos`:'Identificamos'} o perfil do seu cliente ideal. Preencha para liberar.</p>
    <label style="display:block;font-size:13.5px;color:var(--text2);margin-bottom:.5rem;text-align:left">E-mail profissional</label>
    <input id="ei" type="email" placeholder="seu@email.com" value="${S.email}" style="margin-bottom:1rem">
    <label style="display:block;font-size:13.5px;color:var(--text2);margin-bottom:.5rem;text-align:left">WhatsApp</label>
    <input id="pi" type="tel" placeholder="(16) 99999-9999" value="${S.phone}" style="margin-bottom:1.25rem">
    <button class="btn bp" onclick="gate()">Ver minha persona →</button>
    <p style="font-size:12px;color:var(--text3);margin-top:.75rem">Dados seguros. Não enviamos spam.</p>
    <button style="background:none;border:none;color:var(--text2);font-size:13px;cursor:pointer;font-family:inherit;margin-top:.5rem;text-decoration:underline" onclick="S.screen='questions';S.qi=9;render()">← Editar respostas</button>
  </div>
</div>`;}

function Results(){
  const{isB,sec}=calc(),pd=P[S.cluster],off=isB?6:0;
  const[name,tag,disc,dec,blkr,conv]=pd.slice(off,off+6);
  const[sname,stag]=isB?pd.slice(0,2):pd.slice(6,8);
  const adj=ADJ[isB?1:0],prob=S.ans[5];
  return`<div>
    <div class="dh">
      <div style="font-size:11px;font-weight:600;color:${O};text-transform:uppercase;letter-spacing:.1em;margin-bottom:.5rem">Persona do Cliente Ideal</div>
      <div style="font-size:24px;font-weight:700;color:#fff;margin-bottom:.25rem">${S.company||'Sua Empresa'}</div>
      <div style="font-size:13px;color:rgba(255,255,255,.35);margin-bottom:1.5rem">${CN[S.cluster]}</div>
      <div style="width:60px;height:60px;border-radius:50%;background:${O};margin:0 auto .875rem;display:flex;align-items:center;justify-content:center">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div style="font-size:22px;font-weight:700;color:#fff">${name}</div>
      <div style="font-size:14px;color:rgba(255,255,255,.5);margin-top:3px">${tag}</div>
    </div>

    ${prob?`<div class="card" style="margin-bottom:1rem;border-color:rgba(232,118,30,.2);background:rgba(232,118,30,.04)">
      <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:${O};margin-bottom:.375rem">Problema que ele chega querendo resolver</div>
      <p style="font-size:15px;font-style:italic;line-height:1.65">"${prob}"</p>
    </div>`:''}

    <div class="card" style="margin-bottom:1rem">
      <div style="font-size:15px;font-weight:600;margin-bottom:1rem">Como esse cliente funciona</div>
      ${[['Como descobre','#2D6A9F',disc],['Como decide','#2D7A50',dec],['O que trava','#A32D2D',blkr],['O que convence','#854F0B',conv]].map(([lbl,col,txt])=>`<div class="dim">
        <div class="dot" style="background:${col}"></div>
        <div><div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:${col};margin-bottom:2px">${lbl}</div>
        <p style="font-size:14px;line-height:1.65">${txt}</p></div>
      </div>`).join('')}
    </div>

    <div class="card" style="margin-bottom:1rem">
      <div style="font-size:15px;font-weight:600;margin-bottom:.625rem">O que sua comunicação precisa mudar</div>
      <p style="font-size:13.5px;color:var(--text2);margin-bottom:.875rem;line-height:1.6">Para falar diretamente com <strong>${name}</strong>:</p>
      ${adj.map(a=>`<div style="display:flex;gap:.5rem;margin-bottom:.5rem">
        <span style="color:${O};flex-shrink:0;font-size:15px;line-height:1.4">›</span>
        <span style="font-size:14px;line-height:1.5">${a}</span>
      </div>`).join('')}
    </div>

    ${sec?`<div class="card" style="margin-bottom:1rem">
      <div style="display:flex;gap:.75rem;align-items:flex-start">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text3)" stroke-width="2" style="flex-shrink:0;margin-top:2px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <div>
          <div style="font-size:13px;font-weight:600;margin-bottom:3px">Perfil secundário identificado: ${sname} — ${stag}</div>
          <p style="font-size:13px;color:var(--text2);line-height:1.6">Seu negócio provavelmente atende dois públicos com jornadas de compra distintas. O plano completo mapeia os dois e define como comunicar para cada um.</p>
        </div>
      </div>
    </div>`:''}

    <div class="card" style="text-align:center;border-color:rgba(232,118,30,.22);background:rgba(232,118,30,.04);margin-bottom:2rem">
      <div style="font-size:16px;font-weight:600;margin-bottom:.5rem">Sua estratégia construída em cima desse perfil está a uma reunião de distância.</div>
      <p style="color:var(--text2);font-size:14px;margin-bottom:1.25rem;line-height:1.7">Conteúdo, tráfego, abordagem e posicionamento — tudo orientado por quem realmente compra de você.</p>
      <a href="https://agenciatomorrow.com" target="_blank" rel="noopener"
        style="display:block;max-width:300px;margin:0 auto;padding:.875rem 1.25rem;background:${O};color:#fff;border-radius:var(--rs);text-decoration:none;font-weight:500;font-size:15px;text-align:center">
        Falar com a Tomorrow →
      </a>
    </div>
  </div>`;}

function render(){
  document.getElementById('app').innerHTML=
    S.screen==='landing'?Landing():
    S.screen==='questions'?Question():
    S.screen==='gate'?Gate():Results();
  window.scrollTo({top:0,behavior:'smooth'});
}
function pickC(i){S.cluster=i;render();}
function go(){
  const v=document.getElementById('ci')?.value?.trim();
  if(!v){document.getElementById('ci').style.borderColor='#A32D2D';return;}
  if(S.cluster<0)return;
  S.company=v;S.screen='questions';render();
}
function pick(i){S.ans[S.qi]=i;render();setTimeout(()=>{S.qi<9?(S.qi++,render()):(S.screen='gate',render());},190);}
function nxt(){S.ans[S.qi]=document.getElementById('oa')?.value?.trim()||null;S.qi<9?(S.qi++,render()):(S.screen='gate',render());}
function bk(){if(S.qi>0){S.qi--;render();}}
function gate(){
  const e=document.getElementById('ei')?.value?.trim();
  const p=document.getElementById('pi')?.value?.trim();
  if(!e){document.getElementById('ei').style.borderColor='#A32D2D';return;}
  if(!p){document.getElementById('pi').style.borderColor='#A32D2D';return;}
  S.email=e;S.phone=p;
  const{isB}=calc(),pd=P[S.cluster],off=isB?6:0;
  const[name,tag]=pd.slice(off,off+2);
  const[sname,stag]=isB?pd.slice(0,2):pd.slice(6,8);
  const answers=qs.map((q,i)=>{const a=q[1]?(q[1][S.ans[i]]||''):(S.ans[i]||'');return{q:q[0],a};}).filter(({a})=>a);
  const result=[{q:'Persona Principal',a:`${name} — ${tag}`},{q:'Persona Secundária',a:`${sname} — ${stag}`},{q:'Segmento',a:CN[S.cluster]}];
  fetch('https://tmw-leads.felipe-ffa.workers.dev',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({company:S.company,email:S.email,phone:S.phone,tool:'Persona',score:'',answers,result})});
  S.screen='results';render();
}
render();
</script>
