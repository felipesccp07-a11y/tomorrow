
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arquétipo de Marca — Tomorrow Marketing</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fff;--bg2:#f7f6f4;--text:#1a1a1a;--text2:#555;--text3:#999;--border:rgba(0,0,0,.1);--border2:rgba(0,0,0,.18);--O:#E8761E;--r:12px;--rs:8px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
#app{max-width:660px;margin:0 auto;padding:2rem 1.25rem}
.card{background:var(--bg);border:.5px solid var(--border);border-radius:var(--r);padding:1.5rem}
.btn{display:block;width:100%;padding:.875rem 1.25rem;border-radius:var(--rs);font-size:15px;font-weight:500;cursor:pointer;border:none;font-family:inherit;transition:opacity .15s}
.bp{background:var(--O);color:#fff}.bp:hover{opacity:.9}
.bg{background:transparent;color:var(--text2);border:.5px solid var(--border2)}.bg:hover{background:var(--bg2)}
input,textarea{width:100%;padding:.75rem 1rem;border-radius:var(--rs);border:.5px solid var(--border2);background:var(--bg);color:var(--text);font-size:15px;font-family:inherit;outline:none;display:block;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus{border-color:var(--O);box-shadow:0 0 0 3px rgba(232,118,30,.12)}
textarea{resize:none;font-size:14px;line-height:1.6}
.opt{width:100%;text-align:left;padding:.875rem 1rem;border:.5px solid var(--border);border-radius:var(--rs);background:var(--bg);color:var(--text);font-size:14px;cursor:pointer;display:block;font-family:inherit;margin-bottom:.5rem;transition:border-color .12s,background .12s,color .12s;line-height:1.45}
.opt:hover{border-color:var(--O);background:rgba(232,118,30,.04)}
.opt.sel{border-color:var(--O);background:rgba(232,118,30,.09);color:var(--O);font-weight:500}
.pt{height:3px;background:var(--border);border-radius:2px;margin-bottom:1.5rem}
.pf{height:100%;border-radius:2px;background:var(--O);transition:width .4s ease}
.logo{font-size:32px;font-weight:800;color:var(--O);letter-spacing:-2px}
.pills{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;margin-bottom:2.5rem}
.pill{background:var(--bg2);border:.5px solid var(--border);border-radius:var(--r);padding:1rem 1.125rem;text-align:center;flex:1;min-width:120px;max-width:175px}
.dh{background:#0D1620;border-radius:var(--r);padding:2.25rem 1.5rem;text-align:center;margin-bottom:1.25rem}
@media(max-width:480px){#app{padding:1.25rem 1rem}.card{padding:1.25rem}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const O='#E8761E';

// Archetypes [name, tag, color, group(0-3), desc, brands]
const A=[
  ['Inocente','Otimista e puro','#C4940A',0,'Acredita no genuíno e no simples. Promete felicidade, confiança e autenticidade sem artifício.','Dove, Natura, Melissa'],
  ['Sábio','Inteligente e verdadeiro','#2D6A9F',0,'Usa conhecimento para guiar e iluminar. Promete expertise, clareza e verdade acima de tudo.','Google, BBC, McKinsey'],
  ['Explorador','Livre e autêntico','#2E7D50',0,'Busca liberdade e novas experiências. Promete aventura e a coragem de ser diferente.','Jeep, Patagonia, Red Bull'],
  ['Fora da Lei','Rebelde e provocador','#8B2020',1,'Quebra regras e abre novos caminhos. Promete revolução, ruptura e a verdade que ninguém quer dizer.','Harley-Davidson, Diesel, Burger King'],
  ['Mago','Visionário e transformador','#5B2D8E',1,'Transforma o ordinário em extraordinário. Promete que o impossível é possível.','Apple, Disney, Dyson'],
  ['Herói','Corajoso e determinado','#C0392B',1,'Supera desafios e inspira outros a fazerem o mesmo. Promete vitória e superação.','Nike, Adidas, Under Armour'],
  ['Amante','Apaixonado e sensorial','#B03060',2,'Cria conexão, intimidade e beleza. Promete pertencimento e experiências que ficam na memória.','Chanel, Häagen-Dazs, Airbnb'],
  ['Bobo da Corte','Divertido e irreverente','#D06010',2,'Traz leveza, humor e perspectiva. Promete diversão e liberdade de não se levar tão a sério.','Old Spice, Skol, Deadpool'],
  ['Cara Comum','Autêntico e acessível','#5A5A5A',2,'Pertence ao povo, é honesto e direto. Promete comunidade, igualdade e sem frescura.','IKEA, Havaianas, Budweiser'],
  ['Cuidador','Generoso e protetor','#2D7A50',3,'Coloca os outros primeiro. Promete cuidado genuíno, segurança e atenção ao detalhe.','Johnson\'s, Natura, hospitais'],
  ['Governante','Poderoso e responsável','#1A3A5C',3,'Lidera com autoridade e cria ordem. Promete controle, excelência e resultados consistentes.','Rolex, Mercedes, Microsoft'],
  ['Criador','Inventivo e expressivo','#0E6E7A',3,'Cria coisas com significado e forma única. Promete inovação, expressão e originalidade.','Lego, Adobe, Tesla']
];
const G=['Independência','Mudança','Pertencimento','Estabilidade'];

// Questions: [block(0=dono,1=marca,2=confronto), text, isOpen, options[[label,{archIdx:pts}]]]
const qs=[
  [0,'O que te fez entrar nesse negócio?',0,[
    ['Queria resolver um problema que ninguém estava resolvendo direito',{5:5,3:3}],
    ['Queria liberdade, fazer do meu jeito',{2:5,3:3}],
    ['Queria construir algo duradouro, deixar legado',{10:4,11:3}],
    ['Queria ajudar pessoas de verdade',{9:5,8:3}],
    ['Tive uma ideia que não saía da cabeça e precisava executar',{11:5,4:3}]
  ]],
  [0,'Uma decisão difícil aparece. Como você age?',0,[
    ['Analiso, pesquiso, consulto dados antes de qualquer movimento',{1:5,10:3}],
    ['Confio no instinto e decido rápido, ajusto no caminho',{5:4,2:4}],
    ['Consulto as pessoas afetadas pela decisão',{8:4,9:4}],
    ['Imponho o que acredito ser certo e assumo as consequências',{10:5,5:3}],
    ['Busco a solução mais criativa, fora do óbvio',{11:4,4:4}]
  ]],
  [0,'O que te irrita profundamente no mercado em que você atua?',0,[
    ['Mediocridade e falta de capricho',{11:5,10:3}],
    ['Falta de honestidade com o cliente',{0:4,1:4}],
    ['Excesso de regras que travam qualquer inovação',{3:5,2:3}],
    ['Marcas que se levam a sério demais',{7:5,3:2}],
    ['Promessas que não se cumprem',{5:4,0:3}]
  ]],
  [0,'Como você celebra uma conquista grande?',0,[
    ['Compartilho com quem fez parte, é uma vitória coletiva',{8:4,6:4}],
    ['Já estou pensando no próximo desafio',{5:4,2:4}],
    ['Registro, documento — é prova do que construí',{10:4,11:4}],
    ['Celebro com intensidade e depois sigo em frente',{6:4,7:4}],
    ['Fico satisfeito internamente, não preciso de barulho',{1:4,0:4}]
  ]],
  [0,'Que tipo de marca você admira, mesmo fora do seu setor?',0,[
    ['Marcas que desafiam o status quo (Apple, Harley)',{3:5,5:3}],
    ['Marcas que criam mundos e estéticas únicas (Lego, Disney)',{11:5,4:3}],
    ['Marcas que cuidam genuinamente (Natura, Johnson\'s)',{9:5,6:3}],
    ['Marcas que lideram com autoridade e precisão (Rolex)',{10:5,1:2}],
    ['Marcas que conectam pessoas e criam comunidade (Nike)',{8:4,6:3}]
  ]],
  [0,'Qual é o seu maior medo profissional?',0,[
    ['Virar mais um, ser esquecível',{3:5,11:3}],
    ['Perder o controle do que construí',{10:5,1:2}],
    ['Decepcionar quem confia em mim',{9:4,8:4}],
    ['Ficar preso numa rotina que não evolui',{2:5,3:3}],
    ['Tomar uma decisão errada que comprometa tudo',{0:4,1:4}]
  ]],
  [0,'Quando você conta sobre seu negócio, o centro da história é:',0,[
    ['O problema que eu resolvo',{5:4,1:4}],
    ['Como eu faço diferente dos outros',{3:4,11:4}],
    ['Quem eu ajudo e como a vida deles muda',{9:5,6:3}],
    ['O que construí e onde quero chegar',{10:4,11:4}],
    ['A jornada, o processo, o que aprendi',{2:4,4:4}]
  ]],
  [0,'Num grupo, qual papel você naturalmente assume?',0,[
    ['Quem dá direção e toma as decisões',{10:5,5:3}],
    ['Quem questiona o caminho escolhido',{3:4,1:4}],
    ['Quem cuida do bem-estar de todos',{9:5,6:3}],
    ['Quem traz energia e leveza',{7:5,6:3}],
    ['Quem coloca a mão na massa e entrega',{5:4,8:4}]
  ]],
  [1,'Como sua marca se apresenta hoje na comunicação?',0,[
    ['Séria e profissional — transmite autoridade',{10:5,1:3}],
    ['Descolada e próxima — fala como gente',{8:4,7:4}],
    ['Inspiradora — move emoção, faz sonhar',{4:5,6:3}],
    ['Provocativa — diferente, incomoda um pouco',{3:5,7:2}],
    ['Educativa — entrega valor antes de vender',{1:5,9:3}]
  ]],
  [1,'O que sua marca promete, implícita ou explicitamente?',0,[
    ['Resultado concreto — entrega o que promete',{5:4,10:4}],
    ['Uma experiência diferente e memorável',{2:5,4:3}],
    ['Cuidado real e atenção ao detalhe',{9:5,6:2}],
    ['Pertencimento — fazer parte de algo maior',{8:4,6:4}],
    ['Transformação — você sai diferente',{4:5,5:3}]
  ]],
  [1,'Como o cliente se sente depois de comprar de você?',0,[
    ['Satisfeito — fez um bom negócio',{8:4,0:4}],
    ['Cuidado e bem atendido',{9:5,6:2}],
    ['Empolgado, animado pra contar pros outros',{7:4,6:4}],
    ['Seguro — tomou a decisão certa',{10:4,0:3}],
    ['Especial — tratado de forma única',{6:5,4:3}]
  ]],
  [1,'O que sua marca jamais faria?',0,[
    ['Baixar o padrão pra ganhar mais volume',{10:4,11:4}],
    ['Ser fria ou distante com o cliente',{9:4,6:4}],
    ['Seguir tendência sem ter convicção',{3:5,11:3}],
    ['Ser previsível e entediante',{2:4,3:4}],
    ['Expor ou constranger o cliente',{9:4,0:4}]
  ]],
  [1,'Maior elogio que um cliente já te fez:',1,[]],
  [1,'O que diferencia sua marca da concorrência direta?',0,[
    ['A qualidade do que entrego',{10:4,11:4}],
    ['A forma como trato o cliente',{9:4,6:4}],
    ['Meu ponto de vista, minha opinião',{3:4,1:4}],
    ['A experiência que ofereço',{4:4,2:4}],
    ['O resultado que comprovo',{5:5,10:2}]
  ]],
  [2,'Tem algo na comunicação atual que não te representa?',1,[]],
  [2,'Se pudesse mudar uma coisa na percepção que têm da sua marca, o que seria?',1,[]],
  [2,'Em 5 anos, o que você quer que digam da sua marca?',0,[
    ['"São os melhores no que fazem"',{5:4,10:4}],
    ['"Mudaram como eu penso sobre isso"',{4:5,1:3}],
    ['"Eles realmente se importam"',{9:4,8:4}],
    ['"São únicos, não tem igual"',{11:5,3:3}],
    ['"Construíram algo que ficou"',{10:5,11:3}]
  ]]
];

const S={screen:'landing',company:'',qi:0,ans:new Array(17).fill(null),email:'',phone:''};

function calcArch(){
  const own=new Array(12).fill(0),brand=new Array(12).fill(0);
  qs.forEach((q,i)=>{
    if(q[2]||S.ans[i]===null)return;
    const target=q[0]===0?own:brand;
    Object.entries(q[3][S.ans[i]][1]).forEach(([k,p])=>target[+k]+=p);
  });
  const top2=a=>{const s=a.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v);return[s[0].i,s[1].i];};
  return{own:top2(own),brand:top2(brand)};
}

function gap(oi,bi){
  if(oi===bi)return{l:'Alinhamento perfeito',c:'#2D7A50',t:`Você e sua marca compartilham o mesmo arquétipo. Isso é raro — autenticidade total. O risco é o excesso: sem tensão criativa a comunicação pode ficar previsível.`};
  if(A[oi][3]===A[bi][3])return{l:'Tensão criativa',c:'#854F0B',t:`Você e sua marca estão no grupo ${G[A[oi][3]]}, mas se expressam de formas diferentes. Pode ser riqueza — ou ruído. Vale decidir qual dos dois lidera.`};
  return{l:'Gap real de posicionamento',c:'#A32D2D',t:`Você comunica uma coisa, sua marca entrega outra. Você é ${A[oi][0]} (${G[A[oi][3]]}), sua marca opera como ${A[bi][0]} (${G[A[bi][3]]}). Esse conflito explica inconsistências na comunicação e dificulta fidelização.`};
}

function arcCard(idx,sec,label){
  const a=A[idx],as=A[sec];
  return`<div style="border:.5px solid ${a[2]}40;border-radius:var(--r);padding:1.25rem;background:${a[2]}0d;margin-bottom:.875rem">
    <div style="font-size:11px;font-weight:600;color:${a[2]};text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem">${label}</div>
    <div style="display:flex;align-items:center;gap:.875rem;margin-bottom:.875rem">
      <div style="width:44px;height:44px;border-radius:50%;background:${a[2]};flex-shrink:0"></div>
      <div>
        <div style="font-size:20px;font-weight:700;color:${a[2]};line-height:1.1">${a[0]}</div>
        <div style="font-size:13px;color:var(--text2)">${a[1]}</div>
      </div>
    </div>
    <p style="font-size:14px;line-height:1.7;margin-bottom:.625rem">${a[4]}</p>
    <div style="font-size:12px;color:var(--text3);margin-bottom:.5rem">Referências: ${a[5]}</div>
    <div style="font-size:12px;color:var(--text2)">Com traços de <strong style="color:${as[2]}">${as[0]}</strong> — ${as[1]}</div>
  </div>`;
}

const BL=['O Dono','A Marca','O Confronto'];

function Landing(){return`<div style="text-align:center;padding:2.5rem 0 1rem">
  <div class="logo" style="margin-bottom:2rem">tmw</div>
  <h1 style="font-size:28px;font-weight:600;line-height:1.2;margin-bottom:.75rem">Arquétipo de Marca</h1>
  <p style="color:var(--text2);font-size:15px;margin-bottom:2.5rem;max-width:380px;margin-left:auto;margin-right:auto;line-height:1.7">Descubra quem você é como dono e o que sua marca realmente comunica. 17 perguntas, resultado imediato.</p>
  <div class="pills">
    ${[['17','Perguntas'],['2','Perfis mapeados'],['1','Gap analysis']].map(([n,l])=>`<div class="pill"><div style="font-size:22px;font-weight:600;color:${O}">${n}</div><div style="font-size:13px;color:var(--text2);margin-top:2px">${l}</div></div>`).join('')}
  </div>
  <div class="card" style="max-width:420px;margin:0 auto">
    <label style="display:block;font-size:13.5px;color:var(--text2);margin-bottom:.5rem">Nome da sua empresa</label>
    <input id="ci" type="text" placeholder="Ex: ACME" value="${S.company}" onkeydown="if(event.key==='Enter')go()" style="margin-bottom:1rem">
    <button class="btn bp" onclick="go()">Iniciar →</button>
  </div>
</div>`;}

function Question(){
  const q=qs[S.qi],n=S.qi+1,prog=n/17*100;
  const isBlock1Start=S.qi===8,isBlock2Start=S.qi===14;
  const banner=(isBlock1Start||isBlock2Start)?`<div style="background:rgba(232,118,30,.07);border:.5px solid rgba(232,118,30,.2);border-radius:var(--rs);padding:.875rem 1rem;margin-bottom:1rem;font-size:14px;color:var(--text2);line-height:1.6"><strong style="color:${O}">${isBlock1Start?'Agora falamos sobre a marca.':'Última etapa — o confronto.'}</strong> ${isBlock1Start?'As perguntas agora são sobre como sua empresa se comunica, não sobre você.':'Três perguntas finais para revelar onde você e sua marca se encontram ou divergem.'}</div>`:''
  return`<div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.375rem">
      <span style="font-size:11.5px;font-weight:600;color:${O};text-transform:uppercase;letter-spacing:.08em">${BL[q[0]]}</span>
      <span style="font-size:13px;color:var(--text2)">${n} / 17</span>
    </div>
    <div class="pt"><div class="pf" style="width:${prog}%"></div></div>
    ${banner}
    <div class="card">
      <p style="font-size:17px;font-weight:500;margin-bottom:1.25rem;line-height:1.45">${n}. ${q[1]}</p>
      ${q[2]?`<textarea id="oa" rows="4" placeholder="Escreva livremente...">${S.ans[S.qi]||''}</textarea><button class="btn bp" onclick="nextOpen()" style="margin-top:.875rem">Continuar →</button>`
      :q[3].map((o,i)=>`<button class="opt${S.ans[S.qi]===i?' sel':''}" onclick="pick(${i})">${o[0]}</button>`).join('')}
    </div>
    ${S.qi>0?`<button class="btn bg" onclick="bk()" style="margin-top:.625rem;width:auto;padding:.5rem 1rem;font-size:13px">← Voltar</button>`:''}
  </div>`;}

function Gate(){return`<div style="padding:1rem 0">
  <div class="card" style="max-width:440px;margin:0 auto;text-align:center">
    <div style="width:52px;height:52px;border-radius:50%;background:rgba(232,118,30,.1);display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="${O}" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h2 style="font-size:22px;font-weight:600;margin-bottom:.5rem">Análise concluída!</h2>
    <p style="color:var(--text2);font-size:14px;margin-bottom:1.5rem;line-height:1.7">${S.company?`<strong>${S.company}</strong>, mapeamos`:'Mapeamos'} o arquétipo do dono e da marca. Preencha para liberar.</p>
    <label style="display:block;font-size:13.5px;color:var(--text2);margin-bottom:.5rem;text-align:left">E-mail profissional</label>
    <input id="ei" type="email" placeholder="seu@email.com" value="${S.email}" style="margin-bottom:1rem">
    <label style="display:block;font-size:13.5px;color:var(--text2);margin-bottom:.5rem;text-align:left">WhatsApp</label>
    <input id="pi" type="tel" placeholder="(16) 99999-9999" value="${S.phone}" style="margin-bottom:1.25rem">
    <button class="btn bp" onclick="gate()">Ver meu arquétipo →</button>
    <p style="font-size:12px;color:var(--text3);margin-top:.75rem">Dados seguros. Não enviamos spam.</p>
    <button style="background:none;border:none;color:var(--text2);font-size:13px;cursor:pointer;font-family:inherit;margin-top:.5rem;text-decoration:underline" onclick="S.screen='questions';S.qi=16;render()">← Editar respostas</button>
  </div>
</div>`;}

function Results(){
  const{own,brand}=calcArch(),g=gap(own[0],brand[0]);
  return`<div>
    <div class="dh">
      <div style="font-size:11px;font-weight:600;color:${O};text-transform:uppercase;letter-spacing:.1em;margin-bottom:.5rem">Relatório de Arquétipo</div>
      <div style="font-size:24px;font-weight:700;color:#fff;margin-bottom:.25rem">${S.company||'Sua Empresa'}</div>
      <div style="font-size:13px;color:rgba(255,255,255,.35);margin-bottom:1.75rem">Identidade de Marca & Dono</div>
      <div style="display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap">
        <div style="text-align:center">
          <div style="font-size:10px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.375rem">O Dono</div>
          <div style="font-size:22px;font-weight:700;color:${A[own[0]][2]}">${A[own[0]][0]}</div>
          <div style="font-size:12px;color:rgba(255,255,255,.45)">${A[own[0]][1]}</div>
        </div>
        <div style="width:.5px;background:rgba(255,255,255,.12)"></div>
        <div style="text-align:center">
          <div style="font-size:10px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.375rem">A Marca</div>
          <div style="font-size:22px;font-weight:700;color:${A[brand[0]][2]}">${A[brand[0]][0]}</div>
          <div style="font-size:12px;color:rgba(255,255,255,.45)">${A[brand[0]][1]}</div>
        </div>
      </div>
    </div>

    ${arcCard(own[0],own[1],'Arquétipo do Dono')}
    ${arcCard(brand[0],brand[1],'Arquétipo da Marca')}

    <div class="card" style="border-color:${g.c}35;margin-bottom:1rem">
      <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:${g.c};margin-bottom:.375rem">Diagnóstico de Alinhamento</div>
      <div style="font-size:18px;font-weight:600;margin-bottom:.75rem;color:${g.c}">${g.l}</div>
      <p style="font-size:14px;line-height:1.75">${g.t}</p>
    </div>

    <div class="card" style="text-align:center;border-color:rgba(232,118,30,.22);background:rgba(232,118,30,.04);margin-bottom:2rem">
      <div style="font-size:16px;font-weight:600;margin-bottom:.375rem">Quer transformar isso em estratégia?</div>
      <p style="color:var(--text2);font-size:14px;margin-bottom:1.25rem;line-height:1.7">A Tomorrow Marketing transforma esse diagnóstico em posicionamento real, linha editorial e identidade de marca.</p>
      <a href="https://agenciatomorrow.com" target="_blank" rel="noopener"
        style="display:block;max-width:300px;margin:0 auto;padding:.875rem 1.25rem;background:${O};color:#fff;border-radius:var(--rs);text-decoration:none;font-weight:500;font-size:15px;text-align:center">
        Falar com a Tomorrow →
      </a>
    </div>
  </div>`;}

function render(){
  document.getElementById('app').innerHTML=
    S.screen==='landing'?Landing():
    S.screen==='questions'?Question():
    S.screen==='gate'?Gate():Results();
  window.scrollTo({top:0,behavior:'smooth'});
}
function go(){const v=document.getElementById('ci')?.value?.trim();if(!v){document.getElementById('ci').style.borderColor='#A32D2D';return;}S.company=v;S.screen='questions';render();}
function pick(i){S.ans[S.qi]=i;render();setTimeout(()=>{S.qi<16?(S.qi++,render()):(S.screen='gate',render());},190);}
function nextOpen(){S.ans[S.qi]=document.getElementById('oa')?.value?.trim()||'';S.qi<16?(S.qi++,render()):(S.screen='gate',render());}
function bk(){if(S.qi>0){S.qi--;render();}}
function gate(){const e=document.getElementById('ei')?.value?.trim();if(!e){document.getElementById('ei').style.borderColor='#A32D2D';return;}S.email=e;S.phone=document.getElementById('pi')?.value?.trim()||'';S.screen='results';render();}

render();
</script>
</body>
</html>
