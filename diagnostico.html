<title>Diagnóstico Comercial — Tomorrow Marketing</title>
<meta name="description" content="Descubra onde estão os gargalos do seu fluxo de vendas em 5 minutos.">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#ffffff;--bg2:#f7f6f4;--bg3:#f0efe9;
    --text:#1a1a1a;--text2:#555;--text3:#999;
    --border:rgba(0,0,0,.1);--border2:rgba(0,0,0,.18);
    --orange:#E8761E;--orange-bg:rgba(232,118,30,.08);--orange-ring:rgba(232,118,30,.15);
    --radius:12px;--radius-sm:8px;
  }
  html{scroll-behavior:smooth}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
  #app{max-width:660px;margin:0 auto;padding:2rem 1.25rem;min-height:100vh}

  /* Cards */
  .card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:1.5rem}

  /* Buttons */
  .btn{display:block;width:100%;padding:.875rem 1.25rem;border-radius:var(--radius-sm);font-size:15px;font-weight:500;cursor:pointer;border:none;font-family:inherit;transition:opacity .15s,transform .1s;text-align:center}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--orange);color:#fff}
  .btn-primary:hover{opacity:.9}
  .btn-ghost{background:transparent;color:var(--text2);border:.5px solid var(--border2)}
  .btn-ghost:hover{background:var(--bg2)}

  /* Inputs */
  input[type=text],input[type=email],input[type=tel]{
    width:100%;padding:.75rem 1rem;border-radius:var(--radius-sm);
    border:.5px solid var(--border2);background:var(--bg);
    color:var(--text);font-size:15px;font-family:inherit;outline:none;display:block;
    transition:border-color .15s,box-shadow .15s
  }
  input:focus{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-ring)}

  /* Options */
  .opt{
    width:100%;text-align:left;padding:.875rem 1rem;
    border:.5px solid var(--border);border-radius:var(--radius-sm);
    background:var(--bg);color:var(--text);font-size:14px;
    cursor:pointer;display:block;font-family:inherit;
    margin-bottom:.5rem;transition:border-color .12s,background .12s,color .12s;
    line-height:1.45
  }
  .opt:hover{border-color:var(--orange);background:rgba(232,118,30,.04)}
  .opt.sel{border-color:var(--orange);background:rgba(232,118,30,.09);color:var(--orange);font-weight:500}

  /* Progress */
  .progress-track{height:3px;background:var(--border);border-radius:2px;margin-bottom:1.5rem}
  .progress-fill{height:100%;border-radius:2px;background:var(--orange);transition:width .45s ease}

  /* Tags */
  .tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:500}
  .tag-cr{background:rgba(226,75,74,.12);color:#A32D2D}
  .tag-at{background:rgba(239,159,39,.12);color:#854F0B}
  .tag-bm{background:rgba(99,153,34,.12);color:#3B6D11}
  .tag-ex{background:rgba(29,158,117,.12);color:#0F6E56}

  /* Logo */
  .logo{font-size:32px;font-weight:800;color:var(--orange);letter-spacing:-2px;line-height:1}

  /* Feature pills */
  .pill-row{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;margin-bottom:2.5rem}
  .pill{background:var(--bg2);border:.5px solid var(--border);border-radius:var(--radius);padding:1rem 1.125rem;text-align:center;flex:1;min-width:120px;max-width:175px}
  .pill-num{font-size:24px;font-weight:600;color:var(--orange);margin-bottom:2px}
  .pill-label{font-size:13px;color:var(--text2)}

  /* Dark header */
  .dark-header{background:#0D1620;border-radius:var(--radius);padding:2.25rem 1.5rem;text-align:center;margin-bottom:1.25rem}

  /* Category bar */
  .bar-track{height:5px;background:rgba(0,0,0,.08);border-radius:3px;margin-bottom:1rem}
  .bar-fill{height:100%;border-radius:3px;transition:width .6s ease}

  /* Util */
  .label{display:block;font-size:13.5px;color:var(--text2);margin-bottom:.5rem}
  .sub{font-size:12px;color:var(--text3)}
  .ghost-link{background:none;border:none;color:var(--text2);font-size:13px;cursor:pointer;font-family:inherit;padding:.25rem;text-decoration:underline;text-decoration-color:var(--border2)}
  .ghost-link:hover{color:var(--text)}

  @media(max-width:480px){
    #app{padding:1.25rem 1rem}
    .card{padding:1.25rem}
    .pill{padding:.875rem .75rem}
  }
</style>
</head>

<div id="app"></div>
<script>
const O='#E8761E';

// 6 Categorias atualizadas (Blocos)
const cats=[
  {l:'Cenário & Objetivos'},
  {l:'Mkt vs. Vendas Reais'},
  {l:'Raio-X dos Números'},
  {l:'Processo & Time'},
  {l:'Maturidade de Escala'},
  {l:'Retenção & Esteira'}
];

// 15 Perguntas comerciais estruturadas
const qs=[
  // Bloco 1 (Cenário)
  {c:0,q:'1. Qual a maturidade atual do seu negócio hoje?',o:[{l:'Totalmente offline e informal, sem processos claros',v:0},{l:'Offline, mas bem organizado e estruturado',v:2},{l:'Digitalizado, mas as vendas acontecem por acaso',v:3},{l:'Forte no digital e offline com processos de vendas claros',v:5}]},
  {c:0,q:'2. Qual é a sua principal meta de crescimento e faturamento para os próximos 60 dias?',o:[{l:'Sobreviver, não tenho uma meta financeira clara',v:0},{l:'Apenas empatar as contas ou crescer muito pouco',v:1},{l:'Crescimento moderado, bater as metas habituais',v:3},{l:'Escala agressiva, previsível e com injeção rápida de caixa',v:5}]},
  {c:0,q:'3. Como você define a sua receita atual?',o:[{l:'Oscila muito, vivo apagando incêndio e dependendo de indicações',v:0},{l:'Cobre os custos, mas a sobra é baixa e insegura',v:1},{l:'Cresce devagar, mas ainda não tenho segurança total',v:3},{l:'Aumento consistente e previsibilidade real de caixa todo mês',v:5}]},
  
  // Bloco 2 (Mkt vs Vendas)
  {c:1,q:'4. Se você já contratou agências de marketing, sentiu que o resultado final ficou apenas na vaidade (curtidas/seguidores)?',o:[{l:'Sim, sempre entregaram só vaidade sem gerar vendas reais',v:0},{l:'Geraram algumas vendas, mas o foco sempre foi post bonito',v:2},{l:'Focaram em conversão, mas sem escalar o negócio',v:3},{l:'Nunca tive esse problema, minhas ações sempre geraram caixa',v:5}]},
  {c:1,q:'5. Olhando para o seu momento atual, o que o seu negócio mais precisa com urgência?',o:[{l:'De mais seguidores, vídeos e publicações em redes sociais',v:0},{l:'De mais leads, mesmo que sejam desqualificados',v:1},{l:'De um alinhamento melhor entre marketing e vendas',v:3},{l:'De uma estrutura de vendas ponta a ponta focada em fechar negócios',v:5}]},
  
  // Bloco 3 (Números)
  {c:2,q:'6. Você tem clareza e controle absoluto sobre qual é o lucro real e o faturamento da sua empresa hoje?',o:[{l:'Não, misturo contas ou só enxergo o faturamento bruto',v:0},{l:'Sei o faturamento, mas o lucro líquido exato é nebuloso',v:2},{l:'Tenho controle, mas não acompanho as margens em tempo real',v:3},{l:'Sim, tenho controle absoluto, sem achismos',v:5}]},
  {c:2,q:'7. Você sabe exatamente quanto foi investido nas suas ações comerciais e qual é o Retorno Sobre o Investimento (ROI) atual?',o:[{l:'Não faço ideia de quanto invisto nem qual é o retorno',v:0},{l:'Sei o valor do investimento, mas não meço o ROI das campanhas',v:1},{l:'Calculo o retorno de algumas ações periodicamente',v:3},{l:'Acompanho ROI, CAC e indicadores rigorosamente todo mês',v:5}]},

  {c:3,q:'8. Como é feito o treinamento do seu time comercial hoje para extrair o máximo de valor de cada contato recebido?',o:[{l:'Não tenho time de vendas ou não existe nenhum treinamento',v:0},{l:'Treinamento básico apenas na entrada do vendedor',v:1},{l:'Temos reuniões esporádicas de alinhamento de vendas',v:3},{l:'Treinamento contínuo, scripts validados e meta clara',v:5}]},
  {c:3,q:'9. Suas estratégias atuais conseguem gerar uma injeção de caixa rápida através do aumento de demanda?',o:[{l:'Não, dependo 100% de indicações e do fluxo natural',v:0},{l:'Raramente, minhas ações demoram muito para dar retorno',v:2},{l:'Sim, mas o custo por cliente adquirido ainda é alto',v:3},{l:'Sim, consigo gerar picos de caixa e demanda quando necessário',v:5}]},
  
  // Bloco 5 (Maturidade Comercial)
  {c:4,q:'10. Você realiza testes rigorosos (ofertas e canais diferentes) para descobrir onde está a "mina de ouro" do negócio?',o:[{l:'Nunca testo nada, faço sempre do mesmo jeito',v:0},{l:'Faço testes por intuição, sem método ou coleta de dados',v:1},{l:'Realizo testes básicos em campanhas esporádicas',v:3},{l:'Temos um processo rigoroso e contínuo de testes validados',v:5}]},
  {c:4,q:'11. Sua empresa consegue otimizar processos para "fazer mais com menos" antes de colocar mais dinheiro na operação?',o:[{l:'Não, se eu não gastar mais dinheiro, a empresa não cresce',v:0},{l:'Até tentamos, mas a operação é engessada e custosa',v:2},{l:'Conseguimos otimizar alguns gargalos isolados',v:3},{l:'Sim, lapidar conversão e cortar desperdício é nossa rotina',v:5}]},
  {c:4,q:'12. Você se sente seguro hoje para aumentar o investimento e escalar o que já foi validado explorando novos mercados?',o:[{l:'Zero segurança, seria um tiro no escuro',v:0},{l:'Estou inseguro, a operação quebra se o volume aumentar muito',v:1},{l:'Segurança moderada, consigo escalar gradativamente',v:3},{l:'100% seguro, a estrutura comercial está pronta para escalar',v:5}]},

  {c:5,q:'15. Existe uma estratégia ativa na sua empresa para fazer com que os clientes atuais indiquem o seu negócio?',o:[{l:'Indicações acontecem totalmente por acaso e sorte',v:0},{l:'Às vezes peço indicação de forma boca a boca informal',v:1},{l:'Temos um sistema muito básico de indicação',v:3},{l:'Estratégia ativa, incentivada e gamificada rodando todo mês',v:5}]}

// Recomendações por Categoria
const recs=[
  // 0 - Cenário e Objetivos
  {cr:['Defina imediatamente uma meta financeira palpável para os próximos 60 dias.','Estabeleça indicadores de previsibilidade para sair do ciclo de oscilação.','Implemente organização comercial, mesmo fora do digital.'],at:['Aumente a ambição da meta: sair da sobrevivência para o crescimento ativo.','Crie rituais semanais para acompanhar se a receita está estabilizando.'],bm:['Estruture o ambiente digital para apoiar os bons processos físicos que já existem.','Crie projeções de caixa para os próximos 3 a 6 meses com segurança.'],ex:['Mantenha o rigor nos processos que garantem a previsibilidade atual.','Use seu caixa seguro para financiar testes de novos canais de tração.']},
  // 1 - Mkt vs Vendas
  {cr:['Pare imediatamente de investir em métricas de vaidade (likes/seguidores).','Redirecione todo o budget e esforço para campanhas de conversão direta.','Implemente uma estrutura de ponta a ponta focada apenas em fechar negócios.'],at:['Exija da sua equipe/agência relatórios baseados em leads e fechamentos.','Foque em qualificar a demanda antes de focar em volume de visualizações.'],bm:['Crie campanhas combinadas: posicionamento + oferta agressiva de venda.','Alinhe os discursos do marketing (anúncios) com o que o vendedor fala.'],ex:['Continue isolando o ruído das redes sociais e focando no caixa.','Dimensione o orçamento de branding sem comprometer a verba de vendas diretas.']},
  // 2 - Raio-X dos Números
  {cr:['Pare as campanhas agora e mapeie todo o seu fluxo de caixa real.','Separe contas pessoais da empresa e defina seu lucro líquido urgente.','Descubra o Retorno sobre Investimento (ROI) das suas últimas ações.'],at:['Implemente DRE mensal simples para saber de onde o dinheiro entra e sai.','Mapeie o Custo de Aquisição de Cliente (CAC) de todos os canais.'],bm:['Otimize os canais de marketing cortando os de baixo ROI.','Trabalhe para aumentar a margem de lucro líquido e não só o faturamento.'],ex:['Use seus dados de ROI previsível para alavancar e escalar novos investimentos.','Acompanhe o LTV (Lifetime Value) para saber o valor de longo prazo do cliente.']},
  // 3 - Processo e Time
  {cr:['Crie hoje um script básico de atendimento e quebra de objeções.','Pare de depender de boca a boca e crie campanhas ativas de demanda.','Implemente treinamento emergencial para quem atende seus leads.'],at:['Implemente uma rotina semanal de alinhamento com seu time de vendas.','Monitore as conversas do WhatsApp/CRM para auditar a qualidade do atendimento.'],bm:['Crie campanhas rápidas (flash sales) para injeção de caixa pontual.','Estabeleça metas diárias e premiações baseadas em conversão, não em esforço.'],ex:['Escale a equipe comercial mantendo a mesma qualidade do playbook atual.','Construa automações para acelerar a qualificação de leads antes de chegar no time.']},
  // 4 - Maturidade de Escala
  {cr:['Pare de gastar dinheiro sem antes testar pequenas ofertas validadas.','Implemente a fase de "Exploração": teste diferentes canais com orçamentos baixos.','Identifique e elimine os processos que estão encarecendo a sua operação.'],at:['Comece a fase de "Lapidação": pegue o que deu certo e tente diminuir o custo do lead.','Evite escalar investimentos até que a conversão base seja lucrativa.'],bm:['Valide processos em escala moderada para não sobrecarregar sua operação.','Aumente o investimento gradativamente focando apenas na "mina de ouro" validada.'],ex:['Vá para a fase de "Escala": aumente agressivamente a verba nos canais campeões.','Explore agressivamente novas regiões, novos formatos e aquisição de fatia de mercado.']},
  // 5 - Retenção e Esteira
  {cr:['Baixe sua base de clientes antigos hoje e faça uma oferta exclusiva para eles.','Crie um "Upsell" (produto superior) ou "Downsell" (produto mais barato) imediatamente.','Implemente a fase de "Extração" antes de gastar fortunas buscando novos leads.'],at:['Crie um processo estruturado de acompanhamento (pós-venda) para estimular recompras.','Comece a pedir indicações de forma sistêmica após cada entrega bem-sucedida.'],bm:['Desenhe uma Esteira de Produtos clara onde um serviço puxa a necessidade do próximo.','Implemente campanhas mensais de remarketing focadas exclusivamente na base de clientes.'],ex:['Gamifique a indicação: dê recompensas reais para clientes que trouxerem outros.','Transforme seu pós-venda em um canal de receita tão forte quanto a aquisição primária.']}
];

const S={screen:'landing',company:'',qi:0,ans:new Array(15).fill(-1),email:'',phone:''};

function st(p){
  if(p<40)return{l:'Crítico',cls:'cr',col:'#A32D2D'};
  if(p<60)return{l:'Atenção',cls:'at',col:'#854F0B'};
  if(p<80)return{l:'Bom',cls:'bm',col:'#3B6D11'};
  return{l:'Excelente',cls:'ex',col:'#0F6E56'};
}

function calcS(){
  // 6 categorias
  const cp=[0,0,0,0,0,0];
  // Máximo de pontos possíveis por categoria (baseado nas 15 perguntas)
  // Bloco 1: 3 qs = 15 pts | Bloco 2: 2 qs = 10 pts | Bloco 3: 2 qs = 10 pts
  // Bloco 4: 2 qs = 10 pts | Bloco 5: 3 qs = 15 pts | Bloco 6: 3 qs = 15 pts
  const maxPts = [15, 10, 10, 10, 15, 15];
  
  qs.forEach((q,i)=>{if(S.ans[i]>=0)cp[q.c]+=S.ans[i];});
  
  return{
    cp,
    pct:cp.map((p,i)=>Math.round((p/maxPts[i])*100)),
    tot:Math.round(cp.reduce((a,b)=>a+b,0)/75*100)
  };
}

function arcSVG(score){
  const r=70,cx=100,cy=100,circ=2*Math.PI*r;
  const dash=(score/100*circ).toFixed(1),gap=(circ*(1-score/100)).toFixed(1);
  const s=st(score);
  return`<svg viewBox="0 0 200 210" style="width:160px;height:168px">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="9"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.col}" stroke-width="9"
      stroke-dasharray="${dash} ${gap}" stroke-linecap="round"
      transform="rotate(-90 ${cx} ${cy})"/>
    <text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="38" font-weight="600"
      fill="#ffffff" font-family="-apple-system,sans-serif">${score}</text>
    <text x="${cx}" y="${cy+18}" text-anchor="middle" font-size="12"
      fill="rgba(255,255,255,0.4)" font-family="-apple-system,sans-serif">de 100</text>
    <text x="${cx}" y="${cy+38}" text-anchor="middle" font-size="13" font-weight="500"
      fill="${s.col}" font-family="-apple-system,sans-serif">${s.l}</text>
  </svg>`;
}

function radarSVG(pct){
  const cx=145,cy=145,R=95;
  // 6 eixos (hexágono)
  const angs=[-90, -30, 30, 90, 150, 210].map(a=>a*Math.PI/180);
  const pt=(i,r)=>[cx+r*Math.cos(angs[i]),cy+r*Math.sin(angs[i])];
  const labs=['Cenário','Foco Mkt','Números','Time','Escala','Retenção'];
  
  let s=`<svg viewBox="0 0 290 310" style="width:100%;max-width:270px">`;
  
  // Grade de fundo (linhas radiais do polígono)
  [.25,.5,.75,1].forEach(sc=>{
    const pts=angs.map((_,i)=>pt(i,R*sc).join(',')).join(' ');
    s+=`<polygon points="${pts}" fill="none" stroke="rgba(0,0,0,.08)" stroke-width="0.5"/>`;
  });
  
  // Eixos centrais
  angs.forEach((_,i)=>{
    const[x,y]=pt(i,R);
    s+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(0,0,0,.08)" stroke-width="0.5"/>`;
  });
  
  // Shape preenchido com a pontuação
  const dp=pct.map((p,i)=>pt(i,R*p/100).join(',')).join(' ');
  s+=`<polygon points="${dp}" fill="${O}" fill-opacity="0.15" stroke="${O}" stroke-width="1.5"/>`;
  pct.forEach((p,i)=>{
    const[x,y]=pt(i,R*p/100);
    s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="${O}"/>`;
  });
  
  // Labels em volta do Hexágono
  angs.forEach((a,i)=>{
    const[x,y]=pt(i,R+28);
    const anch=Math.cos(a)<-0.1?'end':Math.cos(a)>0.1?'start':'middle';
    const dy=Math.sin(a)>0.1?12:Math.sin(a)< -0.1?-4:4;
    s+=`<text x="${x.toFixed(1)}" y="${(y+dy).toFixed(1)}" text-anchor="${anch}"
      font-size="11" fill="#777" font-family="-apple-system,sans-serif">${labs[i]}</text>`;
  });
  return s+'</svg>';
}

/* ── SCREENS ── */
function Landing(){
  return`<div style="text-align:center;padding:2.5rem 0 1rem">
    <div class="logo" style="margin-bottom:2.5rem">tmw</div>

    </p>
    <div class="pill-row">
      ${[['15','Perguntas estratégicas'],['6','Áreas analisadas'],['1','Relatório personalizado']].map(([n,l])=>

    <div class="card" style="max-width:420px;margin:0 auto">
      <label class="label">Nome da sua empresa</label>
      <input id="ci" type="text" placeholder="Ex: Minha Empresa LTDA" value="${S.company}" style="margin-bottom:1rem"
        onkeydown="if(event.key==='Enter')go()">
      <button class="btn btn-primary" onclick="go()">Iniciar diagnóstico gratuito →</button>
    </div>
  </div>`;
}

function Question(){
  const q=qs[S.qi],cat=cats[q.c],n=S.qi+1,prog=S.qi/15*100;
  return`<div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.375rem">
      <span style="font-size:11.5px;font-weight:600;color:${O};text-transform:uppercase;letter-spacing:.08em">${cat.l}</span>
      <span style="font-size:13px;color:var(--text2)">${n} / 15</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${prog}%"></div></div>
    <div class="card">
      <p style="font-size:17px;font-weight:500;margin-bottom:1.25rem;line-height:1.45">${q.q}</p>
      ${q.o.map(o=>`<button class="opt${S.ans[S.qi]===o.v?' sel':''}" onclick="pick(${o.v})">${o.l}</button>`).join('')}
    </div>
    ${S.qi>0?`<button class="btn btn-ghost" onclick="bk()" style="margin-top:.625rem;width:auto;padding:.5rem 1rem;font-size:13px">← Voltar</button>`:''}
  </div>`;
}

function Gate(){
  return`<div style="padding:1rem 0">
    <div class="card" style="max-width:440px;margin:0 auto;text-align:center">
      <div style="width:52px;height:52px;border-radius:50%;background:rgba(232,118,30,.1);
        display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="${O}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h2 style="font-size:22px;font-weight:600;margin-bottom:.5rem">Diagnóstico concluído!</h2>
      <p style="color:var(--text2);font-size:14px;margin-bottom:1.5rem;line-height:1.7">
        ${S.company?`<strong>${S.company}</strong>, processamos`:'Processamos'} a análise do seu fluxo de vendas.
        Preencha abaixo para liberar o acesso ao relatório de gargalos.
      </p>
      <label class="label" style="text-align:left">E-mail profissional</label>
      <input id="ei" type="email" placeholder="seu@email.com" value="${S.email}" style="margin-bottom:1rem">
      <label class="label" style="text-align:left">WhatsApp</label>
      <input id="pi" type="tel" placeholder="(16) 99999-9999" value="${S.phone}" style="margin-bottom:1.25rem">
      <button class="btn btn-primary" onclick="gate()">Liberar meu diagnóstico →</button>
      <p class="sub" style="margin-top:.75rem">Dados seguros. Não enviamos spam.</p>
      <button class="ghost-link" style="margin-top:.625rem" onclick="S.screen='questions';S.qi=14;render()">← Editar respostas</button>
    </div>
  </div>`;
}

function Results(){
  const{pct,tot}=calcS();
  const ov=tot<40?'Seu fluxo comercial precisa de atenção urgente. Existem gargalos graves travando o crescimento e a entrada de dinheiro no caixa da empresa.':
    tot<60?'Você possui uma base funcional, mas áreas vitais precisam ser corrigidas para você escalar o negócio sem perder margem.':
    tot<80?'Sua estrutura de vendas é muito boa. Focar na otimização dos processos de extração e métricas trará resultados imensos de lucro líquido.':
    'Estrutura comercial excelente, madura e pronta para escala agressiva. Foco 100% no processo de dominação e novas oportunidades de mercado.';
    
  return`<div>
    <div class="dark-header">
      <div style="font-size:11px;font-weight:600;color:${O};text-transform:uppercase;letter-spacing:.1em;margin-bottom:.5rem">Relatório Comercial</div>
      <div style="font-size:26px;font-weight:700;color:#fff;margin-bottom:.25rem">${S.company||'Sua Empresa'}</div>
      <div style="font-size:13px;color:rgba(255,255,255,.35);margin-bottom:1.5rem">Estrutura & Fluxo de Vendas</div>
      ${arcSVG(tot)}
    </div>

    <div class="card" style="margin-bottom:1rem">
      <div style="font-size:15px;font-weight:600;margin-bottom:.625rem">Visão Geral Comercial</div>
      <p style="color:var(--text2);font-size:14px;line-height:1.7;margin-bottom:1.5rem">${ov}</p>
      <div style="display:flex;justify-content:center">${radarSVG(pct)}</div>
    </div>

    <div style="font-size:15px;font-weight:600;margin-bottom:.875rem">Análise e Recomendações por Bloco</div>
    ${cats.map((cat,i)=>{
      const p=pct[i], s=st(p), rk=p<40?'cr':p<60?'at':p<80?'bm':'ex';
      // Ajuste de max pontos para UI exibição
      const maxPts = [15, 10, 10, 10, 15, 15];
      const ptsEarned = Math.round((p/100) * maxPts[i]);
      
      return`<div class="card" style="margin-bottom:.875rem">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:.625rem">
          <div>
            <div style="font-size:15px;font-weight:500;margin-bottom:4px">${cat.l}</div>
            <span class="tag tag-${s.cls}">${s.l}</span>
          </div>
          <div style="text-align:right">
            <div style="font-size:26px;font-weight:600;line-height:1;color:${s.col}">${p}%</div>
            <div class="sub" style="margin-top:2px">${ptsEarned}/${maxPts[i]} pts</div>
          </div>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${p}%;background:${s.col}"></div></div>
        <div style="font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.5rem">Plano de Ação TMW</div>
        ${recs[i][rk].map(r=>`
          <div style="display:flex;gap:.5rem;margin-bottom:.375rem">
            <span style="color:${O};flex-shrink:0;font-size:15px;line-height:1.4">›</span>
            <span style="font-size:14px;color:var(--text);line-height:1.5">${r}</span>
          </div>`).join('')}
      </div>`;
    }).join('')}

    <div class="card" style="text-align:center;border-color:rgba(232,118,30,.22);background:rgba(232,118,30,.04);margin-bottom:2rem">
      <div style="font-size:16px;font-weight:600;margin-bottom:.375rem">Vamos consertar isso juntos?</div>
      <p style="color:var(--text2);font-size:14px;margin-bottom:1.25rem;line-height:1.7">
        A Tomorrow implanta estruturas de vendas de ponta a ponta focadas em escalabilidade e previsibilidade em 60 dias.
      </p>
      <a href="https://agenciatomorrow.com" target="_blank" rel="noopener"
        style="display:block;max-width:300px;margin:0 auto;padding:.875rem 1.25rem;background:${O};
        color:#fff;border-radius:8px;text-decoration:none;font-weight:500;font-size:15px;text-align:center">
        Quero Falar com a Tomorrow →
      </a>
    </div>
  </div>`;
}

/* ── LOGIC ── */
function render(){
  const app=document.getElementById('app');
  if(S.screen==='landing')app.innerHTML=Landing();
  else if(S.screen==='questions')app.innerHTML=Question();
  else if(S.screen==='gate')app.innerHTML=Gate();
  else app.innerHTML=Results();
  window.scrollTo({top:0,behavior:'smooth'});
}

function go(){
  const v=document.getElementById('ci')?.value?.trim();
  if(!v){document.getElementById('ci').style.borderColor='#A32D2D';return;}
  S.company=v;S.screen='questions';render();
}

function pick(v){
  S.ans[S.qi]=v;
  render();
  setTimeout(()=>{
    if(S.qi<14){S.qi++;render();}
    else{S.screen='gate';render();}
  },190);
}

function bk(){if(S.qi>0){S.qi--;render();}}

function gate(){
  const e=document.getElementById('ei')?.value?.trim();
  const p=document.getElementById('pi')?.value?.trim();
  if(!e){document.getElementById('ei').style.borderColor='#A32D2D';return;}
  if(!p){document.getElementById('pi').style.borderColor='#A32D2D';return;}
  S.email=e;
  S.phone=p;
  const {tot,pct}=calcS();
  const getLvl=p=>p<40?'Crítico':p<60?'Atenção':p<80?'Bom':'Excelente';
  const answers=qs.map((q,i)=>{const opt=q.o.find(o=>o.v===S.ans[i]);return{q:q.q,a:opt?opt.l:''};}).filter(({a})=>a);
  const result=[{q:'Score Total Comercial',a:`${tot}/75`},...cats.map((cat,i)=>({q:cat.l,a:`${pct[i]}% — ${getLvl(pct[i])}`}))];
  fetch('https://tmw-leads.felipe-ffa.workers.dev', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({company:S.company,email:S.email,phone:S.phone,tool:'Diagnóstico Comercial',score:`${tot}/75`,answers,result})
  });
  S.screen='results';render();
}

render();
</script>
</body>
</html>
